<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery | CyberConnect Podcast</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 8%;
background:white;
border-bottom:1px solid #d1fae5;
}

.logo{
width:70px;
transition:0.3s;
}

.logo:hover{
transform:scale(1.05);
}

nav{
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:#155E55;
}

nav a.active{
color:#8EEA4A;
border-bottom:2px solid #155E55;
}

/* HAMBURGER */
.hamburger{
display:none;
font-size:28px;
cursor:pointer;
}

/* GALLERY */
.gallery-section{
padding:80px 8%;
text-align:center;
}

.image-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.image-grid img{
width:100%;
border-radius:12px;
transition:0.3s;
}

.image-grid img:hover{
transform:scale(1.05);
border:1px solid #8EEA4A;
}

.video-container iframe{
width:100%;
height:400px;
border-radius:10px;
}

.flyer-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

/* MOBILE */
@media(max-width:768px){

nav{
position:absolute;
top:80px;
right:0;
background:white;
flex-direction:column;
width:200px;
display:none;
padding:20px;
}

nav.show{
display:flex;
}

.hamburger{
display:block;
}

.video-container iframe{
height:220px;
}

}

/* FOOTER */
footer{
text-align:center;
padding:20px;
margin-top:60px;
}

</style>
</head>

<body>

<header>
    <img src="/assets/images/logo.jpeg" class="logo" alt="logo">
    <h1>CyberKonnect Podcast</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="episodes.html">Episodes</a>
        <a href="team.html">Team</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="gallery-section">

<h2>Media Gallery</h2>
<p>Behind the scenes and content.</p>

    <!-- PHOTO GRID -->
    <div class="image-grid">
        <img src="assets/images/photo1.jpg" alt="Podcast Session">
        <img src="assets/images/photo2.jpg" alt="Team Discussion">
        <img src="assets/images/photo3.jpg" alt="Recording Setup">
        <img src="assets/images/photo4.jpg" alt="Guest Speaker">
    </div>

    <!-- VIDEO SECTION -->
    <div class="media-section">
        <h2>Trailer</h2>
        <div class="video-container">
            <!-- Replace with your YouTube video -->
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID"
                    frameborder="0"
                    allowfullscreen>
            </iframe>
        </div>
    </div>

<div class="media-section">
<h2>Event Flyers</h2>

<div class="flyer-grid">
<img src="assets/flyers/flyer1.jpg">
<img src="assets/flyers/flyer2.jpg">
</div>

</div>

</section>

<footer>
© 2026 CyberConnect Podcast | Team House Boys
</footer>

<script>
function toggleMenu(){
document.getElementById("navMenu").classList.toggle("show");
}
</script>

</body>
</html>
